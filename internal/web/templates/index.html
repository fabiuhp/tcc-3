<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Requirement Pipeline</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/app.css" rel="stylesheet">
</head>
<body>
  <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <section class="upload-card card border-0 shadow-sm">
      <div class="card-body p-4 p-md-5">
        <p class="text-uppercase text-secondary small mb-2">Requirement Pipeline</p>
        <h1 class="h3 mb-3">Gerar PDF de requisitos</h1>
        <p class="text-secondary mb-4">Envie o audio da reuniao, aguarde o processamento e baixe o PDF final.</p>

        {{if .Error}}
        <div class="alert alert-danger" role="alert">{{.Error}}</div>
        {{end}}

        {{if .Success}}
        <div class="alert alert-success" role="alert">{{.Success}}</div>
        {{end}}

        {{if .DownloadURL}}
        <a class="btn btn-success w-100 mb-4" href="{{.DownloadURL}}">Baixar PDF</a>
        {{end}}

        <form id="upload-form" action="/process" method="post" enctype="multipart/form-data">
          <div class="mb-3">
            <label class="form-label" for="title">Titulo da reuniao</label>
            <input class="form-control" id="title" name="title" type="text" placeholder="Reuniao de descoberta">
          </div>
          <div class="mb-3">
            <label class="form-label" for="language">Idioma</label>
            <input class="form-control" id="language" name="language" type="text" value="{{.DefaultLanguage}}">
          </div>
          <div class="mb-4">
            <label class="form-label" for="audio">Audio</label>
            <input class="form-control" id="audio" name="audio" type="file" accept="audio/*" required>
          </div>
          <button id="submit-button" class="btn btn-primary w-100" type="submit">Processar audio</button>
          <div id="loading" class="loading text-secondary small mt-3" aria-live="polite">
            <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
            Processando. Isso pode levar alguns minutos.
          </div>
        </form>
      </div>
    </section>
  </main>
  <script>
    document.getElementById('upload-form').addEventListener('submit', function () {
      document.getElementById('loading').classList.add('is-visible');
      document.getElementById('submit-button').disabled = true;
    });
  </script>
</body>
</html>
